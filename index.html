<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5fbf">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="栄東ENGLISH">
<title>栄東合格ENGLISH</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="app" aria-live="polite"><div id="boot" style="max-width:640px;margin:40px auto;padding:0 20px;font-family:-apple-system,sans-serif;line-height:1.7">
<p style="font-size:1.2rem">読み込んでいます…</p>
<div id="boot-help">
<p><strong>この画面のまま進まないときは</strong></p>
<p>iPad の「ファイル」アプリでこのファイルをタップすると「プレビュー」で開きます。プレビューではプログラムが動かないため、アプリは始まりません。Safari で開いてください（送られたリンクを Safari で開く、または Web サーバーに置いたページを Safari で開く）。</p>
<p>Safari で開いても進まないときは、iPad の「設定」→「Safari」→「詳細」→「JavaScript」がオンになっているか確かめてください。</p>
</div>
<p id="boot-err" style="color:#b3261e"></p>
</div></main>
<script>
// 起動を見守る（アプリ本体とは別の、古い書き方のスクリプト。本体が読めなくても動く）
(function () {
  var shown = false;
  var help = document.getElementById('boot-help');
  if (help) help.style.display = 'none'; // スクリプトが動くなら、説明はしばらく待ってから出す
  function err(msg) {
    var el = document.getElementById('boot-err');
    if (el && !window.__APP__) { el.textContent = '起動できませんでした：' + msg + '（iPadOS を最新にすると動くことがあります）'; shown = true; }
  }
  window.addEventListener('error', function (e) { err(e.message || 'スクリプトの読み込みエラー'); });
  window.addEventListener('unhandledrejection', function (e) { err(String(e.reason && e.reason.message || e.reason)); });
  setTimeout(function () { if (!window.__APP__) { var h = document.getElementById('boot-help'); if (h) h.style.display = 'block'; } }, 6000);
  if (!('noModule' in document.createElement('script'))) err('この Safari は古すぎます。iPadOS 14.5 以降にしてください');
})();
</script>
<script type="module" src="app.js"></script>
</body>
</html>
